name: Release

# Publication d'une release GitHub à la demande, depuis Actions > Release > Run workflow :
# la version SemVer et les notes sont déduites des messages Conventional Commits depuis le dernier tag vX.Y.Z
# (github-tag-action), puis l'APK release signé est compilé et attaché à la release.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version à publier (X.Y.Z). Vide : déduite des commits depuis la dernière release."
        type: string
        default: ""
      dry_run:
        description: "Essai à blanc : tout calculer et compiler, sans créer ni tag ni release (APK en artefact)"
        type: boolean
        default: false

# Deux clics rapprochés ne doivent pas publier deux fois la même version.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Publier la release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      # Seul main est protégé par ci-ok : on ne publie rien d'autre (l'essai à blanc marche sur toute branche).
      - name: Vérifier la branche
        if: github.ref != 'refs/heads/main' && !inputs.dry_run
        run: |
          echo "::error::Une release se lance depuis main, pas depuis $GITHUB_REF_NAME."
          exit 1
      - uses: actions/checkout@v4
      # Calcul seul (dry_run) : le tag n'est créé qu'avec la release, une fois l'APK compilé.
      # feat = mineure, fix/perf/deps/revert = correctif, « ! » ou BREAKING CHANGE = majeure, autre = correctif.
      - name: Calculer la version et les notes
        id: version
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ github.token }}
          dry_run: true
          # Par défaut l'action ne calcule de version que sur main ; sur une autre branche (essai à blanc),
          # elle produirait une préversion.
          release_branches: ${{ github.ref_name }}
          custom_tag: ${{ inputs.version }}
          custom_release_rules: "feat:minor:Nouveautés,fix:patch:Corrections,perf:patch:Performances,deps:patch:Dépendances,revert:patch:Retours en arrière"
      - name: Version retenue
        env:
          NEW_VERSION: ${{ steps.version.outputs.new_version }}
          PREVIOUS_TAG: ${{ steps.version.outputs.previous_tag }}
        run: |
          if [ -z "$NEW_VERSION" ]; then
            echo "::error::Aucun commit depuis $PREVIOUS_TAG : rien à publier."
            exit 1
          fi
          echo "Dernière release : $PREVIOUS_TAG, nouvelle version : $NEW_VERSION"
          echo "VERSION=$NEW_VERSION" >> "$GITHUB_ENV"
          echo "TAG=v$NEW_VERSION" >> "$GITHUB_ENV"
      - uses: jdx/mise-action@v4
      - uses: gradle/actions/setup-gradle@v6
      # Toutes les releases doivent être signées avec la même clé, sinon Android refuse la mise à jour.
      # Sans secret, l'APK est signé avec une clé debug jetable : installable, mais pas comme mise à jour.
      - name: Clé de signature
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$RELEASE_KEYSTORE_BASE64" ]; then
            echo "::warning::Secret RELEASE_KEYSTORE_BASE64 absent : APK signé avec une clé debug (voir CONTRIBUTING.md)."
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          echo "RELEASE_KEYSTORE_PATH=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
      - name: Compiler l'APK release
        env:
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: ./gradlew assembleRelease -PappVersion="$VERSION"
      - name: Vérifier la version de l'APK
        run: |
          aapt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/aapt"
          apk_version="$("$aapt" dump badging app/build/outputs/apk/release/app-release.apk | sed -n "s/.*versionName='\([^']*\)'.*/\1/p")"
          echo "versionName de l'APK : $apk_version"
          [ "$apk_version" = "$VERSION" ]
      - name: Écrire les notes de version
        env:
          CHANGELOG: ${{ steps.version.outputs.changelog }}
        # L'action liste aussi ci, docs, test… : on ne garde que les rubriques utiles à qui installe l'app.
        run: |
          notes="$(awk 'BEGIN {keep = 1} /^#+ /{keep = ($0 ~ /^#+ \[/ || $0 ~ /Nouveautés|Corrections|Performances|Dépendances|Retours en arrière|BREAKING/)} keep' <<<"$CHANGELOG")"
          if ! grep -q '^\* ' <<<"$notes"; then
            notes+=$'\n\nAméliorations internes, sans changement visible.'
          fi
          {
            printf '%s\n\n' "$notes"
            printf '## Installer\n\nTélécharger `standbyclock-%s.apk` ci-dessous et l’ouvrir sur le téléphone.\n' "$TAG"
          } > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: APK de l'essai à blanc
        if: inputs.dry_run
        uses: actions/upload-artifact@v7
        with:
          name: standbyclock-release-essai
          path: app/build/outputs/apk/release/app-release.apk
      - name: Créer la release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          apk="standbyclock-$TAG.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          gh release create "$TAG" "$apk" "$apk.sha256" --target "$GITHUB_SHA" --title "StandBy Clock $VERSION" \
            --notes-file "$RUNNER_TEMP/notes.md"
