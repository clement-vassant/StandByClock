name: CI

# Une PR ne peut être mergée que si le job « ci-ok » est vert (règle de protection de main).
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Un nouveau push sur la même branche annule l'exécution précédente.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ktlint, detekt, Android Lint)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew ktlintCheck detekt lintDebug
      - name: Afficher tous les problèmes Android Lint
        if: failure()
        run: cat app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt || true
      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-reports
          path: app/build/reports/

  unit-tests:
    name: Tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew testDebugUnitTest
      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: unit-test-reports
          path: app/build/reports/tests/

  # Captures de référence (Roborazzi, sur la JVM) : une différence de plus de 1 % avec les images du dépôt
  # fait échouer le job ; l'artefact montre la référence, le rendu de la PR et leur différence.
  screenshots:
    name: Captures de référence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: gradle/actions/setup-gradle@v6
      - run: ./gradlew verifyRoborazziDebug
      - name: Différences en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: screenshot-diffs
          path: app/build/outputs/roborazzi/

  instrumented-tests:
    name: Tests d'interface et parcours e2e (émulateur)
    runs-on: ubuntu-latest
    # Deux passes : l'APK debug, puis l'APK release (R8).
    timeout-minutes: 55
    env:
      API_LEVEL: 34
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: gradle/actions/setup-gradle@v6
      # L'émulateur a besoin d'environ 7,4 Go libres pour sa partition userdata ; certains runners n'en ont
      # que 6,7 Go et l'émulateur s'arrête au démarrage (« Not enough space to create userdata partition »).
      # On supprime des outils préinstallés inutiles ici (.NET, Haskell, CodeQL) pour garder une marge.
      - name: Libérer de l'espace disque pour l'émulateur
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h "$HOME"
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache de l'émulateur
        uses: actions/cache@v6
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-${{ env.API_LEVEL }}
      - name: Créer l'émulateur (une seule fois, puis en cache)
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "Émulateur créé et mis en cache."
      # Tests Compose et parcours e2e UI Automator (androidTest/.../e2e) sur l'APK debug, puis parcours e2e sur
      # l'APK release passé par R8. Le script récupère les captures des parcours même si un test échoue.
      - name: Tests Compose et parcours e2e (debug puis release) sur l'émulateur
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ env.API_LEVEL }}
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: scripts/connected-tests.sh
      # Le rapport HTML n'est lisible qu'en téléchargeant l'artefact : on écrit aussi les tests en échec
      # et leur message dans le journal du job.
      - name: Tests en échec
        if: failure()
        run: find app/build/outputs/androidTest-results -name '*.xml' -exec grep -h -A40 '<failure' {} + || true
      - name: Captures des parcours e2e
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-captures
          path: app/build/e2e-captures/
          if-no-files-found: ignore
      - name: Rapports en cas d'échec
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/

  build:
    name: APK debug et release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: jdx/mise-action@v4
      - uses: gradle/actions/setup-gradle@v6
      # La variante release est celle publiée par release.yml : elle doit compiler sur chaque PR.
      - run: ./gradlew assembleDebug assembleRelease
      - uses: actions/upload-artifact@v7
        with:
          name: standbyclock-debug
          path: app/build/outputs/apk/debug/*.apk

  # Point de contrôle unique exigé par la protection de main : vert seulement si tous les autres jobs le sont.
  ci-ok:
    name: ci-ok
    if: always()
    needs: [lint, unit-tests, screenshots, instrumented-tests, build]
    runs-on: ubuntu-latest
    steps:
      - name: Tous les jobs sont verts
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Résultats : $RESULTS"
          for result in $RESULTS; do
            [ "$result" = "success" ] || exit 1
          done
