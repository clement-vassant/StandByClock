org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true
# Accélère les builds locaux et la CI : réutilise les sorties de tâches déjà calculées (cache de build,
# que setup-gradle conserve entre deux exécutions de la CI), saute la configuration quand les scripts
# n'ont pas changé (cache de configuration) et lance en parallèle les tâches indépendantes.
org.gradle.caching=true
org.gradle.configuration-cache=true
org.gradle.parallel=true
